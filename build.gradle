plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradleLegacy
    alias libs.plugins.kotlinDevGradleLegacy
    alias libs.plugins.lombokLegacy
    alias libs.plugins.kotlinLombokLegacy
    alias libs.plugins.spotless
}

// Project identity
group = mod_group_id
version = "${minecraft_version}-${mod_version}-${file_version}"
def isRelease = file_version != "forge-snapshot"

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

apply from: "$projectDir/gradle/scripts/moddevgradle.gradle"
apply from: "$projectDir/dependencies.gradle"
apply from: "$projectDir/gradle/scripts/resources.gradle"
apply from: "$projectDir/gradle/scripts/jars.gradle"
apply from: "$projectDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/gradle/scripts/spotless.gradle"

generateModMetadata.doFirst {
    mkdir('run/client')
    mkdir('run/server')
    mkdir('run/clientData')
    mkdir('run/serverTest')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-removal"
}

jar{
    exclude "**/.cache"
    exclude "**/SimplifiedToTraditional.properties"
}

tasks.register('cameraSystemCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.ptcrys.fpsmatch.common.camera.CameraSystemCheck'
}

tasks.named('check') { dependsOn tasks.named('cameraSystemCheck') }

tasks.register('commandTreeCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    // Use runtime Log4j, not the old compile-only copy brought in by server compatibility dependencies.
    classpath = sourceSets.test.output + sourceSets.main.output +
            sourceSets.main.runtimeClasspath.filter { it.name.startsWith('log4j-') } +
            sourceSets.main.compileClasspath.filter { !it.name.startsWith('log4j-') }
    mainClass = 'com.ptcrys.fpsmatch.common.command.CommandTreeCheck'
    classpath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
}
tasks.named('check') { dependsOn tasks.named('commandTreeCheck') }

// Maven publication
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (isRelease) {
            maven {
                name = "PtcrysReleases"
                url = uri("https://maven.ptcrys.net/releases")
                credentials {
                    username = project.findProperty('ptcrysUsername')
                    password = project.findProperty('ptcrysPassword')
                }
            }
        } else {
            maven {
                name = "PtcrysSnapshots"
                url = uri("https://maven.ptcrys.net/snapshots")
                credentials {
                    username = project.findProperty('ptcrysUsername')
                    password = project.findProperty('ptcrysPassword')
                }
            }
        }
    }
}

plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}
group = 'com.example'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def chapter = providers.gradleProperty('chapter').getOrElse('08')
if (!(chapter in (1..8).collect { String.format('%02d', it) })) {
    throw new GradleException('chapter must be 01 through 08')
}
sourceSets.main.java.setSrcDirs(["chapters/${chapter}/java"])
sourceSets.main.resources.setSrcDirs(['resources'])

legacyForge {
    version = '1.20.1-47.4.10'
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods { elimination_addon { sourceSet(sourceSets.main) } }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.izzel.io/releases/' }
    maven { url = 'https://api.modrinth.com/maven/' }
}
dependencies {
    modImplementation('net.ptcrys:fpsmatch') { transitive = false }
    modRuntimeOnly 'maven.modrinth:kotlin-for-forge:4.11.0'
    modRuntimeOnly 'maven.modrinth:cloth-config:11.1.136+forge'
    // Modern UI is needed by the client. Its mod metadata limits loading to that side.
    modRuntimeOnly 'icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1'
    for (artifact in ['ModernUI-Core', 'ModernUI-Markflow']) {
        additionalRuntimeClasspath(runtimeOnly("icyllis.modernui:${artifact}:3.12.0") {
            exclude group: 'org.apache.logging.log4j'
            exclude group: 'com.google.code.findbugs', module: 'jsr305'
            exclude group: 'org.jetbrains', module: 'annotations'
            exclude group: 'com.ibm.icu', module: 'icu4j'
            exclude group: 'it.unimi.dsi', module: 'fastutil'
        })
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Compile each checkpoint against the same real Forge + FPSMatch classpath.
def chapterCompiles = (1..8).collect { number ->
    def id = String.format('%02d', number)
    tasks.register("compileChapter${id}", JavaCompile) {
        source = fileTree("chapters/${id}/java") { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = layout.buildDirectory.dir("chapters/${id}")
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
tasks.register('compileChapters') { dependsOn(chapterCompiles) }

// Standalone examples accompanying the module reference pages.
tasks.register('compileReference', JavaCompile) {
    source = fileTree('reference/java') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('reference-classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    options.encoding = 'UTF-8'
    options.release = 17
}

name: Build and Snapshot Publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --build-cache --stacktrace

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            build/libs/
            */build/libs/
          if-no-files-found: error
          retention-days: 7

  snapshot:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish snapshot to Maven
        run: |
          chmod +x gradlew
          ./gradlew publish --stacktrace
        env:
          ORG_GRADLE_PROJECT_ptcrysUsername: ${{ secrets.PTCRYS_USERNAME }}
          ORG_GRADLE_PROJECT_ptcrysPassword: ${{ secrets.PTCRYS_PASSWORD }}

      - name: Resolve published snapshot version
        id: snapshot-version
        run: |
          ./gradlew generatePomFileForMavenJavaPublication --quiet
          readarray -t coordinates < <(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('build/publications/mavenJava/pom-default.xml').getroot()
          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          for element in ('groupId', 'artifactId', 'version'):
              print(root.findtext(f'm:{element}', namespaces=namespace))
          PY
          )
          group_path=${coordinates[0]//./\/}
          artifact=${coordinates[1]}
          base_version=${coordinates[2]}
          metadata_url="https://maven.ptcrys.net/snapshots/$group_path/$artifact/$base_version/maven-metadata.xml?run=$GITHUB_RUN_ID"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output maven-metadata.xml "$metadata_url"
          snapshot_version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('maven-metadata.xml').getroot()
          candidates = []
          for entry in root.findall('./versioning/snapshotVersions/snapshotVersion'):
              if entry.findtext('extension') != 'jar' or entry.findtext('classifier'):
                  continue
              candidates.append((entry.findtext('updated', ''), entry.findtext('value', '')))
          if not candidates:
              raise SystemExit('Maven metadata does not contain a main JAR snapshot version')
          print(max(candidates)[1])
          PY
          )
          test -n "$snapshot_version"
          echo "value=$snapshot_version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub snapshot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.snapshot-version.outputs.value }}
          name: v${{ steps.snapshot-version.outputs.value }}
          prerelease: true
          generate_release_notes: true
          files: build/libs/*.jar

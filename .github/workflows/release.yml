name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '本次重点,置顶输出;留空则不显示该段'
      breaking:
        description: '破坏性变更 / 不兼容改动;留空则不显示该段'
      known_issues:
        description: '已知问题与规避方式;留空则不显示该段'
      extra:
        description: '自动日志之外的补充条目;留空则不显示该段'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      RELEASE_BUILD: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish release to Maven
        run: |
          chmod +x gradlew
          ./gradlew build publish --build-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_ptcrysUsername: ${{ secrets.PTCRYS_USERNAME }}
          ORG_GRADLE_PROJECT_ptcrysPassword: ${{ secrets.PTCRYS_PASSWORD }}

      - name: Resolve release version
        id: version
        run: |
          version=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve previous release tag
        id: previous-tag
        run: |
          tag="v${{ steps.version.outputs.value }}"
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | awk -v skip="$tag" '/^v[0-9.]+$/ && $0 != skip { print; exit }')
          echo "value=$previous" >> "$GITHUB_OUTPUT"

      - name: Move release tag to current commit
        run: |
          tag="v${{ steps.version.outputs.value }}"
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: |
            ${{ inputs.notes && '### 本次重点 / Highlights' || '' }}
            ${{ inputs.notes || '' }}

            ${{ inputs.breaking && '### 破坏性变更 / Breaking Changes' || '' }}
            ${{ inputs.breaking || '' }}

            ${{ inputs.known_issues && '### 已知问题 / Known Issues' || '' }}
            ${{ inputs.known_issues || '' }}

            ${{ inputs.extra && '### 补充更新 / Additional Changes' || '' }}
            ${{ inputs.extra || '' }}

            ### 安装 / Installation

            - Minecraft 1.20.1 + Forge 47.4.10+
            - 客户端需 Modern UI `3.12.0.1` 与 Kotlin for Forge,TaCZ 等为可选联动
            - 将本页附件 `fpsmatch-${{ steps.version.outputs.value }}.jar` 放入 `.minecraft/mods/`

            ### 链接 / Links

            - 文档 / Docs: https://fpsmatch.ptcrys.net/master/
            - Maven: `net.ptcrys:fpsmatch:${{ steps.version.outputs.value }}` · https://maven.ptcrys.net/releases

            ### 反馈 / Feedback

            - [Issues](https://github.com/PhasetransCrystal/FPSMatch/issues)
            - [README](https://github.com/PhasetransCrystal/FPSMatch#readme)
            - QQ 群：771884981
          generate_release_notes: true
          previous_tag: ${{ steps.previous-tag.outputs.value }}
          files: build/libs/*.jar
